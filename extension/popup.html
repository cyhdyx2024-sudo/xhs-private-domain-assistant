<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>私信智能顾问</title><link rel="stylesheet" href="popup.css"></head><body><main class="popup-container">
<header class="header"><div class="logo-area"><span class="logo-dot"></span><span class="title">私信智能顾问</span><span class="version-tag">V1.0</span></div><div class="header-status" id="headerStatus">运行中</div></header>

<section id="mainPanel"><div class="switch-card"><div class="switch-info"><div class="switch-title">自动应答与跟进总开关</div><div class="switch-desc" id="switchDesc">副驾只预填，人工确认发送</div></div><label class="toggle"><input type="checkbox" id="masterToggle" checked><span class="slider"></span></label></div><div class="stats-row"><div class="stat-card"><div class="stat-num" id="todayReplied">0</div><div class="stat-label">今日应答</div></div><div class="stat-card"><div class="stat-num lead-num" id="todayLeads">0</div><div class="stat-label">捕获客资</div></div></div><div class="settings-section"><div class="form-group"><label class="form-label">工作模式</label><select class="select-box" id="runMode"><option value="copilot">半自动副驾 (推荐)</option><option value="full_auto">全自动值守 (需明确开启)</option></select></div><div class="form-group"><label class="form-label">生效时段</label><select class="select-box" id="timeScope"><option value="all_day">全天运行</option><option value="night_only">仅夜间 22:00–09:00</option></select></div></div><div class="actions-section"><button class="btn btn-primary" id="btnOpenXhs">前往小红书客服工作台</button><button class="btn btn-secondary" id="btnOpenStudio">⚙️ 打开完整管理控制台 (Studio)</button><button class="btn btn-secondary" id="btnQuickInject">🔄 重新加载当前工作台</button></div><footer class="footer">多模型支持 · 专业知识库 · 人工校准学习</footer></section>
</main><script src="popup.js"></script></body></html>
